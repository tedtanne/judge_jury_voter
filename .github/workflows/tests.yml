name: tests

# Runs the unit tests on every push and pull request. No API key is needed or
# provided: the unit tests never call Claude, and the live-swarm path is not exercised
# here. Results appear in three places: the job log, the run's Summary page (pass/fail
# table plus per-module coverage), and a downloadable "test-reports" artifact.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: bash scripts/run_tests.sh

      - name: Broker evaluation (Nash broker vs weighted vote)
        if: matrix.python-version == '3.12'
        run: python -m jjv.eval_broker --trials 300 --seed 7 --out reports/broker_eval.md

      - name: Publish summary
        if: always()
        run: |
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"
          if [ -f reports/broker_eval.md ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            cat reports/broker_eval.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py${{ matrix.python-version }}
          path: reports/
